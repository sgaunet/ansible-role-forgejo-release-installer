---
# https://taskfile.dev
version: '3'
tasks:
  default:
    desc: "List tasks"
    cmds:
      - task -a

  lint:
    desc: "execute linter"
    cmds:
      - ansible-lint .

  gen:
    desc: "generate doc/ci/molecule files"
    cmds:
      - ./gen-ci.sh
      - ./gen-docs.sh
      - ./gen-molecule-files.sh
      - ./gen-Taskfile-tests.sh

[tools]
task = "3.40.0"
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install-deps]
description = "Install Python deps for molecule"
run = "pip install --upgrade pip && pip install ansible-core==2.17.6 ansible-lint molecule==24.12.0 'molecule-plugins[docker]==23.5.3' ansible-compat==24.9.1 jmespath docker==7.1.0"
